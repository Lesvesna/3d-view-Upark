<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<title>3D Viewer</title>


<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>


<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

canvas{
display:block;
}

#loading{
position:absolute;
top:50%;
width:100%;
text-align:center;
font-family:Arial;
font-size:20px;
}

</style>

</head>


<body>


<div id="loading">
Загрузка модели...
</div>


<script type="module">


import * as THREE from "three";


import {GLTFLoader}
from
"three/addons/loaders/GLTFLoader.js";


import {OrbitControls}
from
"three/addons/controls/OrbitControls.js";




// СЦЕНА

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);




// КАМЕРА

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.01,
100000
);




// РЕНДЕР

const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);




// СВЕТ

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x555555,
5
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
4
);


light.position.set(
100,
200,
100
);


scene.add(light);




// КОНТРОЛЫ

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping = true;

controls.dampingFactor = 0.05;


controls.enablePan = false;


controls.autoRotate = false;


controls.enableZoom = true;




// ЗАГРУЗКА

const loader =
new GLTFLoader();



loader.load(

"models/grass.glb",


(gltf)=>{


const model =
gltf.scene;


scene.add(model);




// поворот CAD

model.rotation.x =
-Math.PI/2;



// размеры

const box =
new THREE.Box3()
.setFromObject(model);


const center =
box.getCenter(
new THREE.Vector3()
);


const size =
box.getSize(
new THREE.Vector3()
);



// центрируем

model.position.x -= center.x;

model.position.y -= center.y;

model.position.z -= center.z;




// масштаб под экран

const maxSize =
Math.max(
size.x,
size.y,
size.z
);


const scale =
5 / maxSize;


model.scale.setScalar(scale);





// камера спереди

const distance =
maxSize * 1.5;



camera.position.set(
0,
0,
distance
);


camera.lookAt(
0,
0,
0
);



controls.target.set(
0,
0,
0
);


controls.minDistance =
distance * 0.3;


controls.maxDistance =
distance * 5;


controls.update();



document
.getElementById("loading")
.remove();



console.log(
"Готово"
);



},


undefined,


(error)=>{

console.error(error);

}

);




// АНИМАЦИЯ

function animate(){

requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);


}


animate();




// RESIZE

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);

});


</script>

</body>

</html>
