<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>


<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


body {
    background: #eeeeee;
}


canvas {
    display: block;
}


#message {
    position: absolute;
    top: 50%;
    width: 100%;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 20px;
    color: #333;
}

</style>

</head>


<body>


<div id="message"></div>


<script type="module">


import * as THREE from 
"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";


import { GLTFLoader }
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js";


import { OrbitControls }
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";



// ---------------------
// СЦЕНА
// ---------------------

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0xffffff);



// ---------------------
// КАМЕРА
// ---------------------

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
1000
);


camera.position.set(
0,
1,
3
);



// ---------------------
// РЕНДЕР
// ---------------------

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);



// ---------------------
// СВЕТ
// ---------------------

const light =
new THREE.HemisphereLight(
0xffffff,
0x555555,
3
);

scene.add(light);


const directionalLight =
new THREE.DirectionalLight(
0xffffff,
2
);


directionalLight.position.set(
5,
5,
5
);


scene.add(directionalLight);



// ---------------------
// УПРАВЛЕНИЕ
// ---------------------

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping = true;

controls.dampingFactor = 0.05;


controls.autoRotate = true;

controls.autoRotateSpeed = 2;



// ---------------------
// ПОЛУЧАЕМ МОДЕЛЬ ИЗ ССЫЛКИ
// ---------------------

const params =
new URLSearchParams(
window.location.search
);


const model =
params.get("model");



if (!model) {

document.getElementById("message").innerHTML =
"❌ Модель не указана<br><br>Добавьте ?model=название.glb";

}



// ---------------------
// ЗАГРУЗКА GLB
// ---------------------

const loader =
new GLTFLoader();



if(model){


loader.load(

"models/" + model,


function(gltf){


const object =
gltf.scene;


scene.add(object);



// центрируем модель

const box =
new THREE.Box3()
.setFromObject(object);


const center =
box.getCenter(
new THREE.Vector3()
);


const size =
box.getSize(
new THREE.Vector3()
);



object.position.x -= center.x;

object.position.y -= center.y;

object.position.z -= center.z;



// масштабирование

const maxSize =
Math.max(
size.x,
size.y,
size.z
);


const scale =
2 / maxSize;


object.scale.set(
scale,
scale,
scale
);



camera.position.set(
0,
0,
3
);



controls.target.set(
0,
0,
0
);


controls.update();



document.getElementById("message").innerHTML = "";


},



function(xhr){

console.log(
"Загрузка:",
(xhr.loaded / xhr.total * 100) + "%"
);

},



function(error){

console.error(error);


document.getElementById("message").innerHTML =
"❌ Ошибка загрузки модели";

}


);


}



// ---------------------
// АНИМАЦИЯ
// ---------------------

function animate(){


requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);


}


animate();



// ---------------------
// АДАПТАЦИЯ ЭКРАНА
// ---------------------

window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth /
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


}

);


</script>


</body>

</html>
