<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}


body{
background:#ffffff;
}


canvas{
display:block;
}


#loading{
position:absolute;
top:50%;
width:100%;
text-align:center;
font-family:Arial;
font-size:20px;
}

</style>

</head>


<body>


<div id="loading">
Загрузка модели...
</div>



<script type="module">


import * as THREE from "three";

import {GLTFLoader}
from
"three/addons/loaders/GLTFLoader.js";


import {OrbitControls}
from
"three/addons/controls/OrbitControls.js";



// СЦЕНА

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);




// КАМЕРА

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.01,
100000
);


camera.position.set(
0,
0,
100
);




// РЕНДЕР

const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);




// СВЕТ

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x444444,
5
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
5
);


light.position.set(
10,
10,
10
);


scene.add(light);




// УПРАВЛЕНИЕ

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping=true;

controls.autoRotate=true;

controls.autoRotateSpeed=2;


controls.minDistance=0.1;

controls.maxDistance=10000;




// ЗАГРУЗКА


const loader =
new GLTFLoader();



loader.load(

"models/grass.glb",


(gltf)=>{


const model =
gltf.scene;


scene.add(model);



console.log("Модель загружена");



// получаем размеры

const box =
new THREE.Box3()
.setFromObject(model);



const center =
box.getCenter(
new THREE.Vector3()
);



const size =
box.getSize(
new THREE.Vector3()
);



console.log(size);



// центрируем

model.position.x -= center.x;

model.position.y -= center.y;

model.position.z -= center.z;




// ===== ГЛАВНОЕ ИЗМЕНЕНИЕ =====

// увеличиваем объект

model.scale.set(
0.05,
0.05,
0.05
);



// камера очень близко

camera.position.set(
80,
80,
80
);


camera.lookAt(
0,
0,
0
);



controls.target.set(
0,
0,
0
);


controls.update();



document.getElementById(
"loading"
).remove();


},



undefined,


(error)=>{

console.error(error);

}

);




// АНИМАЦИЯ


function animate(){

requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);

}


animate();




// RESIZE


window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);

});



</script>


</body>

</html>
