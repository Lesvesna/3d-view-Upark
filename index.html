<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>3D Viewer</title>

<style>
body{
margin:0;
overflow:hidden;
background:white;
}
</style>

</head>


<body>


<script type="module">

import * as THREE from 
"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";


import {GLTFLoader}
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js";


import {OrbitControls}
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";



const scene = new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);



const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
1000
);


camera.position.z=3;



const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


document.body.appendChild(
renderer.domElement
);



scene.add(
new THREE.HemisphereLight(
0xffffff,
0x444444,
3
)
);



const controls =
new OrbitControls(
camera,
renderer.domElement
);



const loader =
new GLTFLoader();



loader.load(
"models/grass.glb",

function(gltf){

scene.add(
gltf.scene
);

console.log("Модель загружена");

}

);



function animate(){

requestAnimationFrame(
animate
);

controls.update();

renderer.render(
scene,
camera
);

}


animate();


</script>


</body>

</html>
