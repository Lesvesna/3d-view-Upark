<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>3D Viewer</title>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}

canvas{
display:block;
}

#loading{
position:absolute;
top:50%;
width:100%;
text-align:center;
font-family:Arial;
}

</style>


</head>


<body>


<div id="loading">
Загрузка...
</div>


<script type="module">


import * as THREE from "three";


import {GLTFLoader}
from
"three/addons/loaders/GLTFLoader.js";


import {OrbitControls}
from
"three/addons/controls/OrbitControls.js";





const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);





const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
100000
);


camera.position.set(
0,
0,
200
);





const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


document.body.appendChild(
renderer.domElement
);





scene.add(
new THREE.HemisphereLight(
0xffffff,
0x444444,
5
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
5
);


light.position.set(
50,
100,
100
);


scene.add(light);





const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping=true;

controls.autoRotate=true;

controls.autoRotateSpeed=2;

controls.enablePan=false;





const loader =
new GLTFLoader();



loader.load(

"models/grass.glb",


(gltf)=>{


const model =
gltf.scene;


scene.add(model);



console.log("MODEL OK");




// размеры ДО поворота

const box =
new THREE.Box3()
.setFromObject(model);



const center =
box.getCenter(
new THREE.Vector3()
);



const size =
box.getSize(
new THREE.Vector3()
);



console.log(size);




// центр

model.position.sub(center);




// масштаб

const max =
Math.max(
size.x,
size.y,
size.z
);


model.scale.setScalar(
100/max
);




// теперь пробуем поворот

model.rotation.y =
Math.PI/2;





camera.position.set(
0,
20,
250
);


camera.lookAt(
0,
0,
0
);


controls.target.set(
0,
0,
0
);


controls.update();



document
.getElementById("loading")
.remove();


},



undefined,



(error)=>{

console.error(error);

}

);






function animate(){

requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);

}


animate();





window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);

});



</script>


</body>

</html>
