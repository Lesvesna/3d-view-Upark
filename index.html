<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>


<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}


body {
    background: #ffffff;
}


canvas {
    display: block;
}

#error {
    position: absolute;
    top: 50%;
    width: 100%;
    text-align: center;
    font-family: Arial;
    color: red;
    font-size: 20px;
}

</style>

</head>


<body>

<div id="error"></div>


<script type="module">


import * as THREE from 
"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";


import { GLTFLoader }
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js";


import { OrbitControls }
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";



// Сцена

const scene = new THREE.Scene();

scene.background = new THREE.Color(0xffffff);



// Камера

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
1000
);

camera.position.set(0, 1, 3);



// Рендер

const renderer =
new THREE.WebGLRenderer({
    antialias: true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);



// Свет

const light =
new THREE.HemisphereLight(
0xffffff,
0x555555,
3
);

scene.add(light);



const directional =
new THREE.DirectionalLight(
0xffffff,
2
);

directional.position.set(
5,
5,
5
);

scene.add(directional);



// Управление

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping = true;

controls.dampingFactor = 0.05;


controls.autoRotate = true;
controls.autoRotateSpeed = 2;



// Получаем название модели из ссылки
//
// пример:
// ?model=chair.glb


const params =
new URLSearchParams(
window.location.search
);


const model =
params.get("model");



if (!model) {

document.getElementById("error").innerHTML =
"❌ Модель не указана";

}



// Загружаем модель


const loader =
new GLTFLoader();



if(model){

loader.load(

"models/" + model,


(gltf)=>{


const object =
gltf.scene;



scene.add(object);



// Автоматическое масштабирование

const box =
new THREE.Box3()
.setFromObject(object);



const size =
box.getSize(
new THREE.Vector3()
);



const center =
box.getCenter(
new THREE.Vector3()
);



object.position.x -= center.x;
object.position.y -= center.y;
object.position.z -= center.z;



const maxSize =
Math.max(
size.x,
size.y,
size.z
);



const scale =
2 / maxSize;


object.scale.set(
scale,
scale,
scale
);



// камера под объект

camera.position.z = 3;


controls.target.set(
0,
0,
0
);


controls.update();



},



(error)=>{

console.log(error);

document.getElementById("error").innerHTML =
"❌ Ошибка загрузки модели";

}


);

}



// Анимация

function animate(){


requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);


}


animate();



// Под размер экрана

window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth /
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


}

);


</script>


</body>

</html>
