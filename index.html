<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<title>3D Viewer</title>


<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
 }
}
</script>


<style>

html,body{
margin:0;
height:100%;
overflow:hidden;
}

canvas{
display:block;
}

#loading{
position:absolute;
top:50%;
width:100%;
text-align:center;
font-family:Arial;
}

</style>

</head>


<body>


<div id="loading">
Загрузка...
</div>



<script type="module">


import * as THREE from "three";

import {GLTFLoader}
from
"three/addons/loaders/GLTFLoader.js";


import {OrbitControls}
from
"three/addons/controls/OrbitControls.js";




// СЦЕНА

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);




// КАМЕРА

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
10000
);


camera.position.set(
0,
0,
5
);




// РЕНДЕР

const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


document.body.appendChild(
renderer.domElement
);




// СВЕТ

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x555555,
5
)
);





// ГРУППА ВРАЩЕНИЯ

const objectGroup =
new THREE.Group();


scene.add(objectGroup);





// КОНТРОЛЬ

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping=true;

controls.enablePan=false;

controls.autoRotate=true;

controls.autoRotateSpeed=2;





// ЗАГРУЗКА

const loader =
new GLTFLoader();



loader.load(

"models/grass.glb",


(gltf)=>{


const model =
gltf.scene;



objectGroup.add(model);




// ----------
// Исправление ориентации CAD
// ----------


// попробуем вертикальную ориентацию

model.rotation.x =
Math.PI/2;




// ----------
// получаем реальные размеры
// ----------


const box =
new THREE.Box3()
.setFromObject(model);



const size =
box.getSize(
new THREE.Vector3()
);



const center =
box.getCenter(
new THREE.Vector3()
);



console.log("SIZE",size);

console.log("CENTER",center);




// переносим модель относительно группы

model.position.sub(center);




// масштабируем

const maxSize =
Math.max(
size.x,
size.y,
size.z
);



const scale =
3/maxSize;


model.scale.setScalar(scale);




// после масштабирования
// камера смотрит в центр


camera.position.set(
0,
0,
5
);


camera.lookAt(
0,
0,
0
);



controls.target.set(
0,
0,
0
);


controls.update();



document
.getElementById("loading")
.remove();


},



undefined,


(error)=>{

console.error(error);

}

);





// АНИМАЦИЯ

function animate(){

requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);


}


animate();





window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);

});



</script>

</body>

</html>
