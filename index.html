<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<style>

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#ffffff;
}

canvas{
    display:block;
}

#loading{
    position:absolute;
    top:50%;
    width:100%;
    text-align:center;
    font-family:Arial;
    font-size:20px;
}

</style>

</head>


<body>


<div id="loading">
Загрузка модели...
</div>



<script type="module">


import * as THREE from "three";


import { GLTFLoader }
from
"three/addons/loaders/GLTFLoader.js";




// ======================
// СЦЕНА
// ======================

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);




// ======================
// КАМЕРА
// ======================

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.01,
10000
);


// строго спереди

camera.position.set(
0,
0,
150
);


camera.lookAt(
0,
0,
0
);




// ======================
// РЕНДЕР
// ======================

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);




// ======================
// СВЕТ
// ======================

scene.add(
new THREE.HemisphereLight(
    0xffffff,
    0x555555,
    5
)
);


const light =
new THREE.DirectionalLight(
    0xffffff,
    4
);


light.position.set(
50,
100,
100
);


scene.add(light);




// ======================
// ГРУППА ДЛЯ ВРАЩЕНИЯ
// ======================

const pivot =
new THREE.Group();


scene.add(pivot);




// ======================
// ЗАГРУЗКА МОДЕЛИ
// ======================

const loader =
new GLTFLoader();



let model;



loader.load(

"models/grass.glb",


(gltf)=>{


model =
gltf.scene;


pivot.add(model);



console.log(
"Модель загружена"
);



// размеры

const box =
new THREE.Box3()
.setFromObject(model);



const center =
box.getCenter(
new THREE.Vector3()
);



const size =
box.getSize(
new THREE.Vector3()
);



console.log(
"Размер:",
size
);



console.log(
"Центр:",
center
);




// переносим модель в центр

model.position.x -= center.x;

model.position.y -= center.y;

model.position.z -= center.z;





// масштаб

const maxSize =
Math.max(
size.x,
size.y,
size.z
);



const scale =
80 / maxSize;



model.scale.setScalar(
scale
);




// камера

camera.position.set(
0,
0,
150
);


camera.lookAt(
0,
0,
0
);




document
.getElementById("loading")
.remove();



},



undefined,



(error)=>{

console.error(
"Ошибка:",
error
);

}

);




// ======================
// АНИМАЦИЯ
// ======================

function animate(){


requestAnimationFrame(
animate
);



if(pivot){

pivot.rotation.y += 0.01;

}



renderer.render(
scene,
camera
);


}


animate();




// ======================
// RESIZE
// ======================

window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth /
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


});


</script>


</body>

</html>
