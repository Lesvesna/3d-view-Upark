<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<style>

html, body {

    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;

}


body {

    background:#ffffff;

}


canvas {

    display:block;

}


#loading {

    position:absolute;
    top:50%;
    width:100%;
    text-align:center;

    font-family:Arial;
    font-size:20px;

}

</style>


</head>


<body>


<div id="loading">
Загрузка 3D модели...
</div>



<script type="module">


import * as THREE from "three";


import { GLTFLoader }
from
"three/addons/loaders/GLTFLoader.js";


import { OrbitControls }
from
"three/addons/controls/OrbitControls.js";




// --------------------
// Сцена
// --------------------


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);




// --------------------
// Камера
// --------------------


const camera =
new THREE.PerspectiveCamera(

45,

window.innerWidth /
window.innerHeight,

0.1,

1000

);


camera.position.set(
0,
1,
3
);




// --------------------
// Рендер
// --------------------


const renderer =
new THREE.WebGLRenderer({

    antialias:true

});


renderer.setSize(

window.innerWidth,

window.innerHeight

);


renderer.setPixelRatio(

window.devicePixelRatio

);


document.body.appendChild(

renderer.domElement

);




// --------------------
// Свет
// --------------------


scene.add(

new THREE.HemisphereLight(

0xffffff,

0x555555,

3

)

);



const light =
new THREE.DirectionalLight(

0xffffff,

2

);


light.position.set(

5,

5,

5

);


scene.add(light);




// --------------------
// Управление
// --------------------


const controls =
new OrbitControls(

camera,

renderer.domElement

);


controls.enableDamping = true;


controls.autoRotate = true;


controls.autoRotateSpeed = 2;




// --------------------
// Загрузка модели
// --------------------


const loader =
new GLTFLoader();



loader.load(


"models/grass.glb",



(gltf)=>{


const model =
gltf.scene;



scene.add(model);




// Центрирование


const box =
new THREE.Box3()
.setFromObject(model);



const center =
box.getCenter(

new THREE.Vector3()

);



const size =
box.getSize(

new THREE.Vector3()

);



model.position.x -= center.x;

model.position.y -= center.y;

model.position.z -= center.z;




// Размер


const maxSize =
Math.max(

size.x,

size.y,

size.z

);



const scale =
2 / maxSize;



model.scale.set(

scale,

scale,

scale

);



camera.position.set(

0,

0,

3

);



controls.target.set(

0,

0,

0

);



controls.update();



document.getElementById(
"loading"
).style.display="none";



console.log(
"Модель успешно загружена"
);



},



(xhr)=>{


console.log(

"Загрузка",

xhr.loaded

);



},



(error)=>{


console.error(

"Ошибка загрузки:",

error

);



document.getElementById(
"loading"
).innerHTML =
"Ошибка загрузки модели";

}



);




// --------------------
// Анимация
// --------------------


function animate(){


requestAnimationFrame(

animate

);


controls.update();


renderer.render(

scene,

camera

);


}


animate();




// --------------------
// Размер окна
// --------------------


window.addEventListener(

"resize",

()=>{


camera.aspect =

window.innerWidth /

window.innerHeight;


camera.updateProjectionMatrix();



renderer.setSize(

window.innerWidth,

window.innerHeight

);



}

);



</script>


</body>

</html>
