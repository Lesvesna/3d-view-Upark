<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<style>

html, body {
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}


body {
    background:#ffffff;
}


canvas {
    display:block;
}


#loading {

    position:absolute;
    top:50%;
    width:100%;
    text-align:center;

    font-family:Arial;
    font-size:20px;

}

</style>


</head>


<body>


<div id="loading">
Загрузка модели...
</div>



<script type="module">


import * as THREE from "three";


import {GLTFLoader}
from
"three/addons/loaders/GLTFLoader.js";




// =======================
// СЦЕНА
// =======================


const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);




// =======================
// КАМЕРА
// =======================


const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
100000
);


// строго фронтальный вид

camera.position.set(
0,
50,
300
);


camera.lookAt(
0,
0,
0
);




// =======================
// РЕНДЕР
// =======================


const renderer =
new THREE.WebGLRenderer({
    antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);




// =======================
// СВЕТ
// =======================


scene.add(
new THREE.HemisphereLight(
0xffffff,
0x555555,
5
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
5
);


light.position.set(
100,
200,
100
);


scene.add(light);




// =======================
// ГРУППА ВРАЩЕНИЯ
// =======================


const pivot =
new THREE.Group();


scene.add(pivot);




// =======================
// ЗАГРУЗКА
// =======================


const loader =
new GLTFLoader();



let model;



loader.load(

"models/grass.glb",


(gltf)=>{


model =
gltf.scene;


pivot.add(model);



console.log(
"Модель загружена"
);




// ===== ИСПРАВЛЕНИЕ CAD =====


// поворачиваем модель из DWG

model.rotation.set(
0,
Math.PI / 2,
0
);





// получаем размеры

const box =
new THREE.Box3()
.setFromObject(model);



const center =
box.getCenter(
new THREE.Vector3()
);



const size =
box.getSize(
new THREE.Vector3()
);



console.log(
"Размер:",
size
);



console.log(
"Центр:",
center
);




// ставим объект в центр

model.position.x -= center.x;

model.position.y -= center.y;

model.position.z -= center.z;





// масштаб

const maxSize =
Math.max(
size.x,
size.y,
size.z
);



const scale =
120 / maxSize;



model.scale.setScalar(
scale
);





// камера ближе

camera.position.set(
0,
40,
250
);


camera.lookAt(
0,
0,
0
);



document
.getElementById("loading")
.remove();



},


undefined,


(error)=>{

console.error(
error
);

}

);





// =======================
// ВРАЩЕНИЕ ОБЪЕКТА
// =======================


function animate(){


requestAnimationFrame(
animate
);



if(pivot){

pivot.rotation.y += 0.01;

}



renderer.render(
scene,
camera
);


}


animate();





// =======================
// RESIZE
// =======================


window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth/window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


});



</script>


</body>

</html>
