<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #ffffff;
}

canvas {
    display: block;
}

#message {
    position: absolute;
    top: 50%;
    width: 100%;
    text-align: center;
    font-family: Arial;
    font-size: 18px;
    color: #333;
}

</style>

</head>


<body>

<div id="message">
Загрузка 3D модели...
</div>


<script type="module">


// Подключаем Three.js

import * as THREE from 
"https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js";


import { GLTFLoader }
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js";


import { OrbitControls }
from
"https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js";



// Сцена

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0xffffff);



// Камера

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth / window.innerHeight,
0.1,
1000
);


camera.position.set(
0,
1,
3
);



// Рендер

const renderer =
new THREE.WebGLRenderer({
    antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);



// Свет

const light =
new THREE.HemisphereLight(
0xffffff,
0x555555,
3
);

scene.add(light);



const dirLight =
new THREE.DirectionalLight(
0xffffff,
2
);


dirLight.position.set(
5,
5,
5
);


scene.add(dirLight);



// Управление мышью

const controls =
new OrbitControls(
camera,
renderer.domElement
);


controls.enableDamping = true;


controls.autoRotate = true;

controls.autoRotateSpeed = 2;



// Берём имя модели из ссылки

// пример:
// ?model=grass.glb


const params =
new URLSearchParams(
window.location.search
);


const model =
params.get("model");



if (!model) {

document.getElementById("message").innerHTML =
"❌ Не указана модель";

}



// Загрузка GLB


const loader =
new GLTFLoader();



loader.load(

"models/" + model,


function(gltf){


const object =
gltf.scene;


scene.add(object);



// центрируем объект

const box =
new THREE.Box3()
.setFromObject(object);


const center =
box.getCenter(
new THREE.Vector3()
);


const size =
box.getSize(
new THREE.Vector3()
);



object.position.x -= center.x;
object.position.y -= center.y;
object.position.z -= center.z;



// подгоняем размер

const maxSize =
Math.max(
size.x,
size.y,
size.z
);


const scale =
2 / maxSize;


object.scale.set(
scale,
scale,
scale
);



camera.position.set(
0,
0,
3
);



controls.target.set(
0,
0,
0
);


controls.update();



document.getElementById("message").style.display="none";


},



undefined,



function(error){

console.error(error);


document.getElementById("message").innerHTML =
"❌ Ошибка загрузки модели";

}


);



// Анимация

function animate(){


requestAnimationFrame(
animate
);


controls.update();


renderer.render(
scene,
camera
);


}


animate();



// Размер окна

window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth /
window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


});


</script>


</body>

</html>
