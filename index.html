<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>3D Viewer</title>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>


<style>

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
}


body{
background:white;
}


canvas{
display:block;
}


#loading{
position:absolute;
top:50%;
width:100%;
text-align:center;
font-family:Arial;
}

</style>

</head>


<body>


<div id="loading">
Загрузка модели...
</div>


<script type="module">


import * as THREE from "three";


import {GLTFLoader}
from
"three/addons/loaders/GLTFLoader.js";




// СЦЕНА

const scene =
new THREE.Scene();


scene.background =
new THREE.Color(0xffffff);




// КАМЕРА

const camera =
new THREE.PerspectiveCamera(
45,
window.innerWidth/window.innerHeight,
0.1,
10000
);


// фиксированный фронтальный вид

camera.position.set(
0,
0,
150
);


camera.lookAt(
0,
0,
0
);




// РЕНДЕР

const renderer =
new THREE.WebGLRenderer({
antialias:true
});


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.setPixelRatio(
window.devicePixelRatio
);


document.body.appendChild(
renderer.domElement
);




// СВЕТ

scene.add(
new THREE.HemisphereLight(
0xffffff,
0x555555,
5
)
);


const light =
new THREE.DirectionalLight(
0xffffff,
5
);


light.position.set(
50,
100,
100
);


scene.add(light);




// ЗАГРУЗКА


let model;


const loader =
new GLTFLoader();



loader.load(

"models/grass.glb",


(gltf)=>{


model =
gltf.scene;


scene.add(model);



console.log("Загружено");




// ===== ИСПРАВЛЕНИЕ CAD =====


// пробуем поставить вертикально

model.rotation.x = Math.PI / 2;



// если будет наоборот:
// model.rotation.x = -Math.PI / 2;



// центр

const box =
new THREE.Box3()
.setFromObject(model);



const center =
box.getCenter(
new THREE.Vector3()
);



const size =
box.getSize(
new THREE.Vector3()
);



model.position.sub(center);




// масштаб

const max =
Math.max(
size.x,
size.y,
size.z
);


model.scale.setScalar(
80/max
);





document
.getElementById("loading")
.remove();


},


undefined,


(error)=>{

console.error(error);

}

);




// АНИМАЦИЯ


function animate(){

requestAnimationFrame(
animate
);



if(model){

// вращаем сам объект

model.rotation.y += 0.01;

}



renderer.render(
scene,
camera
);


}


animate();




// RESIZE


window.addEventListener(
"resize",
()=>{


camera.aspect =
window.innerWidth/window.innerHeight;


camera.updateProjectionMatrix();


renderer.setSize(
window.innerWidth,
window.innerHeight
);


});


</script>


</body>

</html>
